name: Collect buzz data

on:
  schedule:
    # 23:50 KST daily (14:50 UTC) — capture (almost) the full Korean day
    - cron: "50 14 * * *"
  workflow_dispatch: {}   # allows manual "Run workflow" button

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
      USE_MOCK: "false"
      BUZZTREND_DB: data/buzztrend.db
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-collect.txt

      - name: Collect today's buzz
        run: python cli.py collect

      - name: Commit collected data
        run: |
          git config user.name "buzztrend-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: daily collection $(date +%F)"
          git push
